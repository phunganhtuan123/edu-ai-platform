services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edutech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edutech}
      POSTGRES_DB: edutech
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edutech"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://edutech:${POSTGRES_PASSWORD:-edutech}@db:5432/edutech?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen3:8b}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
